name: CI for Deploy Pineline

on:
  push:
    branches: [ "main"]
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: myapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6.5'
          bundler-cache: true

      - name: Setup DB and Run RSpec Tests
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
        run: |
          bundle exec rails db:create db:schema:load
          bundle exec rspec
    